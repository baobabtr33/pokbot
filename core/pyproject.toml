[project]
name = "pokbot-core"
version = "0.2.1"
description = "Pure poker engine, protocol and bot SDK shared by the pokbot CLI and server."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pokbot_core"]
