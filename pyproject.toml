[project]
name = "pokbot-workspace"
version = "0.2.2"
requires-python = ">=3.12"
dependencies = ["pokbot-core", "pokbot-cli", "pokbot-server"]

[tool.uv.workspace]
members = ["core", "cli", "server"]

[tool.uv.sources]
pokbot-core = { workspace = true }
pokbot-cli = { workspace = true }
pokbot-server = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6", "ruff>=0.6", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
