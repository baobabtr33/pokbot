[project]
name = "pokbot-server"
version = "0.1.0"
description = "pokbot match server: matchmaking, match runner, spectators."
requires-python = ">=3.12"
dependencies = ["pokbot-core", "fastapi>=0.111", "uvicorn[standard]>=0.30"]

[project.scripts]
pokbot-server = "pokbot_server.main:run"

[tool.uv.sources]
pokbot-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pokbot_server"]
